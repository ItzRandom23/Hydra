name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Scan the checked-out project
        shell: bash
        run: |
          version=8.30.1
          archive=gitleaks_${version}_linux_x64.tar.gz
          base=https://github.com/gitleaks/gitleaks/releases/download/v${version}
          mkdir -p "$RUNNER_TEMP/hydra-scan"
          cd "$RUNNER_TEMP/hydra-scan"
          curl --fail --silent --show-error --location --remote-name "$base/$archive"
          curl --fail --silent --show-error --location --remote-name "$base/gitleaks_${version}_checksums.txt"
          grep -F " $archive" "gitleaks_${version}_checksums.txt" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          ./gitleaks dir --redact=100 --no-banner "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
